name: foss_community
description: Google-free community app template for self-hosted backends.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.8.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  provider: ^6.1.5
  scoped_model: ^2.0.0
  adaptive_theme: ^3.7.0
  http: ^1.5.0
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  video_player: ^2.10.0
  cached_network_image: ^3.4.1
  file_selector: ^1.0.4
  flutter_markdown: ^0.7.7+1
  emoji_picker_flutter: ^4.3.0
  table_calendar: ^3.2.0
  intl: ^0.20.2
  timeago: ^3.7.1
  url_launcher: ^6.3.2
  logger: ^2.6.1
  json_annotation: ^4.9.0
  sentry_flutter: ^9.7.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.6
  build_runner: ^2.10.4
  json_serializable: ^6.11.3

flutter:
  uses-material-design: true
