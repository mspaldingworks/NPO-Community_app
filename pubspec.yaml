name: npo_community
description: Alumni directory and community app for the Emerge Kentucky program.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.8.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  go_router: ^14.8.1
  provider: ^6.0.3
  http: ^1.5.0
  shared_preferences: ^2.0.7
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  table_calendar: ^3.1.3
  intl: ^0.20.2
  emoji_picker_flutter: ^2.2.0
  timeago: ^3.6.1
  web_socket_channel: ^3.0.3
  logger: ^2.3.0
  adaptive_theme: ^3.6.0
  url_launcher: ^6.3.0
  scoped_model: ^2.0.0
  video_player: ^2.9.1
  path_provider: ^2.1.4
  cached_network_image: ^3.4.0
  file_selector: ^1.0.4
  json_annotation: ^4.9.0
  build_runner: ^2.10.4
  json_serializable: ^6.11.3

  flutter_markdown: ^0.7.4

  logging: any
  meta: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  mockito: any
flutter:
  uses-material-design: true

