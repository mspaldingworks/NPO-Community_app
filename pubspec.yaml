    sdk: flutter
  cupertino_icons: ^1.0.2
  crypto: ^3.0.3
  go_router: ^14.8.1
  provider: ^6.0.3
  http: ^1.5.0
  shared_preferences: ^2.0.7
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  table_calendar: ^3.1.3
  intl: ^0.20.2
  emoji_picker_flutter: ^2.2.0
  timeago: ^3.6.1
  web_socket_channel: ^3.0.3
  logger: ^2.3.0
  adaptive_theme: ^3.6.0
  icalendar_parser: ^2.1.0
  url_launcher: ^6.3.0
  scoped_model: ^2.0.0
  webview_flutter: ^4.7.0
  video_player: ^2.9.1
  path_provider: ^2.1.4
  cached_network_image: ^3.4.0
  file_selector: ^1.0.4
  json_annotation: ^4.9.0
  build_runner: ^2.10.4
  json_serializable: ^6.11.3

  flutter_map: ^6.1.0
  flutter_map_marker_cluster: ^1.3.6
  latlong2: ^0.9.1
  geolocator: ^11.1.0
  flutter_markdown: ^0.7.4
  sqflite: ^2.4.0
